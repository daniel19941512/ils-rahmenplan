// ============================================================
// Kürzel-Legende
// ============================================================
const CODES = {
  ".":   { label: "frei",              start: null, end: null },
  "ARL": { label: "Ausfallreserve WT",  start: 8,    end: 16   },
  "AL":  { label: "Ausfallreserve WE",  start: 8,    end: 8    },
  "RFP": { label: "Rufbereitschaft",    start: 5.5,  end: 30   },
  "LF5": { label: "Früh 24/7",          start: 6,    end: 14   },
  "LF6": { label: "Früh Schichtf.",     start: 6.5,  end: 14   },
  "LF1": { label: "Früh (gegen SF)",    start: 6,    end: 14   },
  "LF2": { label: "Früh KTW",           start: 6,    end: 13   },
  "LS5": { label: "Spät 24/7",          start: 14,   end: 22   },
  "LS6": { label: "Spät Schichtf.",     start: 14,   end: 22   },
  "LS1": { label: "Spät (gegen SF)",    start: 14,   end: 22   },
  "LS2": { label: "Spät KTW",           start: 13,   end: 21   },
  "LN5": { label: "Nacht 24/7",         start: 22,   end: 30,  night: true },
  "LN6": { label: "Nacht Schichtf.",    start: 22,   end: 30.5, night: true },
  "LN1": { label: "Nacht (gegen SF)",   start: 22,   end: 30,  night: true },
  "LT1": { label: "Tag Werktag",        start: 9,    end: 17   },
  "LT2": { label: "Tag Werktag",        start: 10,   end: 18   },
  "LT3": { label: "Tag Samstag",        start: 8,    end: 16   },
  "LT5": { label: "Tag Samstag",        start: 12,   end: 20   },
  "LT4": { label: "Tag Sonntag",        start: 9,    end: 17   },
  "LT6": { label: "Tag Sonntag",        start: 10,   end: 18   },
};

const WEEKDAY_NAMES = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
const DRK_TAGE = { gerade: [1, 3, 5], ungerade: [0, 2, 4, 6] };

// Tatsaechliche Arbeitszeit je Kuerzel (Stunden) - RFP zaehlt mit 3h Grundbewertung,
// nicht mit der vollen Rufbereitschaftsspanne.
const DURATION = {
  ".": 0, "ARL": 8, "AL": 0, "RFP": 3,
  "LF5": 8, "LF6": 7.5, "LF1": 8, "LF2": 7,
  "LS5": 8, "LS6": 8, "LS1": 8, "LS2": 8,
  "LN5": 8, "LN6": 8.5, "LN1": 8,
  "LT1": 8, "LT2": 8, "LT3": 8, "LT5": 8, "LT4": 8, "LT6": 8,
};
const SOLL_WOCHENARBEITSZEIT = 38.5; // BV Arbeitszeit ILS, Paragraph 2 Abs. 1
const SOLL_TOLERANZ = 0.5; // +/- Stunden, innerhalb dessen "im Soll" gilt

function weekHours(row) {
  return row.reduce((sum, code) => sum + (DURATION[code] ?? 0), 0);
}
function avgWeeklyHours(grid) {
  const total = grid.reduce((sum, row) => sum + weekHours(row), 0);
  return total / grid.length;
}

const OWN_CODES = {
  RFP: { wd: ["LF5", "LS5", "LF2", "LS2", "LN5", "RFP"], sat: ["LF5", "LS5", "LN5", "RFP"], sun: ["LF5", "LS5", "LN5", "RFP"] },
  SF: { wd: ["LF6", "LS6", "LN6"], sat: ["LF6", "LS6", "LN6"], sun: ["LF6", "LS6", "LN6"] },
  NSB: { wd: ["LT1", "LT2", "LF1", "LS1", "LN1"], sat: ["LT3", "LT5", "LF1", "LS1", "LN1"], sun: ["LT4", "LT6", "LF1", "LS1", "LN1"] },
};
const CAN_ALSO_COVER = { RFP: ["NSB"], SF: ["RFP", "NSB"], NSB: [] };

function codePoolFor(planKey, dayType) {
  const groups = [planKey, ...CAN_ALSO_COVER[planKey]];
  const set = new Set();
  groups.forEach((g) => OWN_CODES[g][dayType].forEach((c) => set.add(c)));
  set.add(dayType === "wd" ? "ARL" : "AL");
  set.add(".");
  return Array.from(set);
}

const PLANS = {
  RFP: {
    label: "Disponent", weeks: 18, people: 9,
    weekdayCodes: codePoolFor("RFP", "wd"), satCodes: codePoolFor("RFP", "sat"), sunCodes: codePoolFor("RFP", "sun"),
    nightCodes: ["LN5"],
    coverage: (day) => day < 5 ? { LF5: 1, LS5: 1, LN5: 1, LF2: 1, LS2: 1, RFP: 1 } : { LF5: 1, LS5: 1, LN5: 1, RFP: 1 },
  },
  SF: {
    label: "Schichtführung", weeks: 12, people: 6,
    weekdayCodes: codePoolFor("SF", "wd"), satCodes: codePoolFor("SF", "sat"), sunCodes: codePoolFor("SF", "sun"),
    nightCodes: ["LN6"],
    coverage: (day, parity) => DRK_TAGE[parity].includes(day) ? { LF6: 1, LS6: 1, LN6: 1 } : {},
  },
  NSB: {
    label: "Notrufsachbearbeiter", weeks: 10, people: 5,
    weekdayCodes: codePoolFor("NSB", "wd"), satCodes: codePoolFor("NSB", "sat"), sunCodes: codePoolFor("NSB", "sun"),
    nightCodes: ["LN1"],
    coverage: (day, parity) => {
      const keinSF = !DRK_TAGE[parity].includes(day);
      const req = {};
      if (day < 5) { req.LT1 = 1; if (keinSF) req.LT2 = 1; }
      else if (day === 5) { req.LT5 = 1; if (keinSF) req.LT3 = 1; }
      else { req.LT6 = 1; if (keinSF) req.LT4 = 1; }
      if (keinSF) { req.LF1 = 1; req.LS1 = 1; req.LN1 = 1; }
      return req;
    },
  },
};

function emptyGrid(weeks) { return Array.from({ length: weeks }, () => Array(7).fill(".")); }
function codesForDay(plan, day) { return day < 5 ? plan.weekdayCodes : day === 5 ? plan.satCodes : plan.sunCodes; }
function parityOf(r) { return r % 2 === 0 ? "ungerade" : "gerade"; }

// Nur die an diesem Tag/dieser Paritaet tatsaechlich noch VERFUEGBAREN Kuerzel
// zur Auswahl anbieten: sowohl grundsaetzlich passende (z.B. Schichtfuehrer-
// Dienste nur an SF-Tagen) als auch solche, die an dem Tag ueber ALLE
// Rahmenplaene hinweg noch nicht ausgeschoepft sind (Deckung schon erreicht ->
// nicht mehr waehlbar, verhindert versehentliche Doppelbesetzung).
const SF_EIGENE_CODES = ["LF6", "LS6", "LN6"];
const NUR_KEIN_SF_CODES = ["LT2", "LT3", "LT4", "LF1", "LS1", "LN1"];
const RESERVE_CAP_PRO_TAG = 4; // insgesamt 4 ARL/AL-Plaetze pro Tag, ueber alle Gruppen verteilt

function usedCountAcrossPlans(grids, day, parity, code, excludePlanKey, excludeRow) {
  let count = 0;
  Object.keys(PLANS).forEach((pk) => {
    const g = grids[pk];
    for (let r = 0; r < PLANS[pk].weeks; r++) {
      if (parityOf(r) !== parity) continue;
      if (pk === excludePlanKey && r === excludeRow) continue;
      if (g[r][day] === code) count++;
    }
  });
  return count;
}

function requiredForCode(day, parity, code) {
  let required = 0;
  Object.keys(PLANS).forEach((pk) => {
    const req = PLANS[pk].coverage(day, parity)[code];
    if (req) required = Math.max(required, req);
  });
  return required;
}

function codesForDayAndParity(planKey, day, parity, currentValue, grids, rowIndex) {
  const base = codesForDay(PLANS[planKey], day);
  const sfTag = DRK_TAGE[parity].includes(day);
  const reserveCode = day < 5 ? "ARL" : "AL";
  const filtered = base.filter((code) => {
    if (code === currentValue) return true; // eigener aktueller Wert bleibt immer sichtbar/waehlbar
    if (code === ".") return true;
    if (SF_EIGENE_CODES.includes(code) && !sfTag) return false;
    if (NUR_KEIN_SF_CODES.includes(code) && sfTag) return false;
    if (code === reserveCode) {
      return usedCountAcrossPlans(grids, day, parity, code, planKey, rowIndex) < RESERVE_CAP_PRO_TAG;
    }
    const required = requiredForCode(day, parity, code);
    if (required > 0) {
      return usedCountAcrossPlans(grids, day, parity, code, planKey, rowIndex) < required;
    }
    return true;
  });
  return filtered;
}

function analyzePlan(planKey, grid) {
  const plan = PLANS[planKey];
  const weeks = plan.weeks;
  const chain = [];
  for (let r = 0; r < weeks; r++) for (let d = 0; d < 7; d++) chain.push([r, d]);
  const L = chain.length;
  const codeAt = (i) => { const [r, d] = chain[i]; return grid[r][d]; };
  const isHard = (c) => c !== "." && c !== "ARL" && c !== "AL";
  const badCells = new Set();
  const issues = [];
  const mark = (r, d) => badCells.add(`${r},${d}`);

  for (let i = 0; i < L; i++) {
    const j = (i + 1) % L;
    const c1 = codeAt(i), c2 = codeAt(j);
    if (isHard(c1) && isHard(c2) && CODES[c1] && CODES[c2]) {
      const rest = 24 + CODES[c2].start - CODES[c1].end;
      if (rest < 11) {
        const [r1, d1] = chain[i], [r2, d2] = chain[j];
        mark(r1, d1); mark(r2, d2);
        issues.push({ type: "Ruhezeit", text: `Woche ${r1+1} ${WEEKDAY_NAMES[d1]} (${c1}) → Woche ${r2+1} ${WEEKDAY_NAMES[d2]} (${c2}): nur ${rest.toFixed(1)}h Pause` });
      }
    }
  }
  for (let i = 0; i < L; i++) {
    const j = (i + 1) % L;
    if (codeAt(i) === "RFP" && codeAt(j) === "RFP") {
      const [r1, d1] = chain[i], [r2, d2] = chain[j];
      mark(r1, d1); mark(r2, d2);
      issues.push({ type: "RFP", text: `Woche ${r1+1} ${WEEKDAY_NAMES[d1]} → Woche ${r2+1} ${WEEKDAY_NAMES[d2]}: RFP 2 Tage in Folge` });
    }
  }
  for (let i = 0; i < L; i++) {
    let cnt = 0; const cells = [];
    for (let k = 0; k < 3; k++) {
      const idx = (i + k) % L;
      if (plan.nightCodes.includes(codeAt(idx))) { cnt++; cells.push(chain[idx]); }
    }
    if (cnt > 2) {
      cells.forEach(([r, d]) => mark(r, d));
      const [r0, d0] = chain[i];
      issues.push({ type: "Nächte", text: `Ab Woche ${r0+1} ${WEEKDAY_NAMES[d0]}: mehr als 2 Nächte in Folge` });
    }
  }
  for (let i = 0; i < L; i++) {
    const j = (i + 1) % L;
    const c1 = codeAt(i), c2 = codeAt(j);
    if (plan.nightCodes.includes(c1) && (c2 === "ARL" || c2 === "AL")) {
      const [r1, d1] = chain[i], [r2, d2] = chain[j];
      mark(r1, d1); mark(r2, d2);
      issues.push({ type: "Nacht→ARL", text: `Woche ${r1+1} ${WEEKDAY_NAMES[d1]} → Woche ${r2+1} ${WEEKDAY_NAMES[d2]}: ARL/AL direkt nach Nacht` });
    }
  }
  for (let i = 0; i < L; i++) {
    let free = 0;
    for (let k = 0; k < 7; k++) { const c = codeAt((i + k) % L); if (c === "." || c === "ARL" || c === "AL") free++; }
    if (free < 1) {
      const [r0, d0] = chain[i];
      for (let k = 0; k < 7; k++) mark(...chain[(i + k) % L]);
      issues.push({ type: "Arbeitstage", text: `Ab Woche ${r0+1} ${WEEKDAY_NAMES[d0]}: mehr als 6 Arbeitstage am Stück` });
    }
  }
  return { badCells, issues };
}

function computeCombinedCoverage(grids) {
  const result = { ungerade: [], gerade: [] };
  ["ungerade", "gerade"].forEach((parity) => {
    for (let d = 0; d < 7; d++) {
      let required = {};
      Object.keys(PLANS).forEach((pk) => {
        Object.entries(PLANS[pk].coverage(d, parity)).forEach(([code, need]) => {
          required[code] = Math.max(required[code] || 0, need);
        });
      });
      // Reserve-Kapazitaet: 4 ARL/AL-Plaetze pro Tag, egal aus welcher Gruppe
      const reserveCode = d < 5 ? "ARL" : "AL";
      required[reserveCode] = RESERVE_CAP_PRO_TAG;
      const counts = {};
      Object.keys(required).forEach((code) => {
        counts[code] = usedCountAcrossPlans(grids, d, parity, code, null, null);
      });
      result[parity].push({ day: d, required, counts });
    }
  });
  return result;
}

// ============================================================
// Firestore Hilfsfunktionen (kein Login noetig - offener Zugriff)
// ============================================================
// Firestore unterstuetzt KEINE verschachtelten Arrays (Array von Arrays) -
// deshalb werden die Tabellen als JSON-Text gespeichert und beim Laden
// wieder in echte Arrays zurueckverwandelt.
function docToEntry(data) {
  return { ...data, grids: JSON.parse(data.gridsJson) };
}

async function fsListDrafts() {
  const snap = await db.collection(DRAFTS_COLLECTION).orderBy("timestamp", "desc").get();
  const out = [];
  snap.forEach((doc) => {
    if (doc.id === AUTOSAVE_DOC_ID) return;
    out.push({ id: doc.id, ersteller: doc.data().ersteller, titel: doc.data().titel, timestamp: doc.data().timestamp });
  });
  return out;
}
async function fsSaveNew(ersteller, titel, grids) {
  const ref = await db.collection(DRAFTS_COLLECTION).add({ ersteller, titel, timestamp: Date.now(), gridsJson: JSON.stringify(grids) });
  return ref.id;
}
async function fsOverwrite(id, ersteller, titel, grids) {
  await db.collection(DRAFTS_COLLECTION).doc(id).set({ ersteller, titel, timestamp: Date.now(), gridsJson: JSON.stringify(grids) });
}
async function fsLoad(id) {
  const doc = await db.collection(DRAFTS_COLLECTION).doc(id).get();
  if (!doc.exists) throw new Error("nicht gefunden");
  return docToEntry(doc.data());
}
async function fsDelete(id) {
  await db.collection(DRAFTS_COLLECTION).doc(id).delete();
}
async function fsAutosave(ersteller, grids) {
  await db.collection(DRAFTS_COLLECTION).doc(AUTOSAVE_DOC_ID).set({
    ersteller: ersteller || "(kein Name eingetragen)",
    titel: "Autospeicherung (zuletzt bearbeitet)",
    timestamp: Date.now(),
    gridsJson: JSON.stringify(grids),
  });
}
async function fsLoadAutosave() {
  const doc = await db.collection(DRAFTS_COLLECTION).doc(AUTOSAVE_DOC_ID).get();
  if (!doc.exists) throw new Error("keine Autospeicherung vorhanden");
  return docToEntry(doc.data());
}

// ============================================================
// UI
// ============================================================
function RahmenplanWerkstatt() {
  const [planKey, setPlanKey] = useState("RFP");
  const [grids, setGrids] = useState({ RFP: emptyGrid(PLANS.RFP.weeks), SF: emptyGrid(PLANS.SF.weeks), NSB: emptyGrid(PLANS.NSB.weeks) });
  const [ersteller, setErsteller] = useState("");
  const [titel, setTitel] = useState("");
  const [draftList, setDraftList] = useState([]);
  const [currentId, setCurrentId] = useState(null);
  const [status, setStatus] = useState("Verbinde mit der Datenbank...");
  const [busy, setBusy] = useState(false);
  const [autoSaveStatus, setAutoSaveStatus] = useState("");
  const isFirstRender = useRef(true);

  const plan = PLANS[planKey];
  const grid = grids[planKey];
  const analysis = useMemo(() => analyzePlan(planKey, grid), [planKey, grid]);
  const combinedCoverage = useMemo(() => computeCombinedCoverage(grids), [grids]);

  const refreshList = useCallback(async () => {
    setBusy(true);
    try {
      const list = await fsListDrafts();
      setDraftList(list);
      setStatus(`Verbunden - ${list.length} gespeicherte(r) Entwurf/Entwürfe.`);
    } catch (e) {
      setStatus("Konnte Liste nicht laden: " + e.message);
    }
    setBusy(false);
  }, []);

  useEffect(() => { refreshList(); }, [refreshList]);

  useEffect(() => {
    if (isFirstRender.current) { isFirstRender.current = false; return; }
    setAutoSaveStatus("Änderungen erkannt, speichere...");
    const t = setTimeout(async () => {
      try {
        await fsAutosave(ersteller, grids);
        setAutoSaveStatus(`Automatisch gespeichert um ${new Date().toLocaleTimeString("de-DE")}`);
      } catch (e) {
        setAutoSaveStatus("Autospeichern fehlgeschlagen: " + e.message);
      }
    }, 2000);
    return () => clearTimeout(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [grids]);

  const loadAutosave = async () => {
    setBusy(true);
    setStatus("Lade Autospeicherung...");
    try {
      const data = await fsLoadAutosave();
      setGrids(data.grids);
      setErsteller(data.ersteller || "");
      setStatus(`Autospeicherung geladen (${new Date(data.timestamp).toLocaleString("de-DE")}).`);
    } catch (e) {
      setStatus("Keine Autospeicherung gefunden.");
    }
    setBusy(false);
  };

  const saveNew = async () => {
    if (!ersteller.trim()) { setStatus("Bitte deinen Namen eintragen."); return; }
    setBusy(true);
    setStatus("Speichere...");
    try {
      const id = await fsSaveNew(ersteller.trim(), titel.trim() || "(ohne Titel)", grids);
      setCurrentId(id);
      setStatus(`Gespeichert als "${titel.trim() || "(ohne Titel)"}".`);
      setTitel("");
      await refreshList();
    } catch (e) {
      setStatus("Fehler beim Speichern: " + e.message);
    }
    setBusy(false);
  };

  const overwrite = async () => {
    if (!currentId) { setStatus("Keinen geöffneten Entwurf zum Überschreiben."); return; }
    setBusy(true);
    setStatus("Überschreibe...");
    try {
      const existing = draftList.find((d) => d.id === currentId);
      await fsOverwrite(currentId, ersteller.trim() || "?", existing ? existing.titel : "(ohne Titel)", grids);
      setStatus("Aktualisiert.");
      await refreshList();
    } catch (e) {
      setStatus("Fehler: " + e.message);
    }
    setBusy(false);
  };

  const openDraft = async (d) => {
    setBusy(true);
    setStatus(`Öffne "${d.titel}"...`);
    try {
      const data = await fsLoad(d.id);
      setGrids(data.grids);
      setErsteller(data.ersteller || "");
      setCurrentId(d.id);
      setStatus(`"${d.titel}" geöffnet.`);
    } catch (e) {
      setStatus("Fehler beim Öffnen: " + e.message);
    }
    setBusy(false);
  };

  const removeDraft = async (id) => {
    setBusy(true);
    try {
      await fsDelete(id);
      await refreshList();
      setStatus("Entwurf gelöscht.");
    } catch (e) {
      setStatus("Löschen fehlgeschlagen: " + e.message);
    }
    setBusy(false);
  };

  const setCell = (r, d, value) => {
    setGrids((prev) => {
      const next = { ...prev, [planKey]: prev[planKey].map((row) => [...row]) };
      next[planKey][r][d] = value;
      return next;
    });
  };
  const clearPlan = () => setGrids((prev) => ({ ...prev, [planKey]: emptyGrid(plan.weeks) }));

  const styles = {
    page: { fontFamily: "'IBM Plex Sans', system-ui, sans-serif", background: "#101826", minHeight: "100vh", color: "#E7ECF3", padding: 16 },
    box: { maxWidth: 1100, margin: "0 auto" },
    panel: { background: "#161F2E", border: "1px solid #2A3446", borderRadius: 10, padding: 12, marginBottom: 16 },
    btn: { padding: "8px 14px", borderRadius: 8, border: "1px solid #2A3446", background: "#161F2E", color: "#8B98AC", fontSize: 12, cursor: "pointer" },
    btnPrimary: { padding: "8px 14px", borderRadius: 8, border: "1px solid #5B8DEF", background: "#1C2B47", color: "#DCE7FF", fontSize: 12, cursor: "pointer" },
  };

  return (
    <div style={styles.page}>
      <div style={styles.box}>
        <h1 style={{ fontSize: 22, fontWeight: 700, margin: "0 0 4px 0" }}>Rahmenplan-Werkstatt · ILS Freiburg</h1>
        <p style={{ color: "#8B98AC", fontSize: 13, margin: "0 0 4px 0" }}>Kein Login nötig - jeder mit diesem Link kann speichern und öffnen.</p>
        <p style={{ color: "#4C5A70", fontSize: 12, margin: "0 0 16px 0" }}>{autoSaveStatus || "Noch keine Änderungen in dieser Sitzung."}</p>

        <div style={styles.panel}>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginBottom: 8 }}>
            <input placeholder="Dein Name" value={ersteller} onChange={(e) => setErsteller(e.target.value)}
              style={{ padding: "6px 10px", borderRadius: 6, border: "1px solid #2A3446", background: "#0D1420", color: "#E7ECF3", fontSize: 12, width: 140 }} />
            <input placeholder="Titel/Kommentar" value={titel} onChange={(e) => setTitel(e.target.value)}
              style={{ padding: "6px 10px", borderRadius: 6, border: "1px solid #2A3446", background: "#0D1420", color: "#E7ECF3", fontSize: 12, flex: "1 1 200px" }} />
            <button onClick={saveNew} disabled={busy} style={styles.btnPrimary}>Als neuen Entwurf speichern</button>
            <button onClick={overwrite} disabled={busy || !currentId} style={styles.btn}>Geöffneten Entwurf überschreiben</button>
            <button onClick={loadAutosave} disabled={busy} style={styles.btn}>Letzte Autospeicherung laden</button>
          </div>
          <p style={{ fontSize: 12, color: "#8FE3A6", margin: "0 0 8px 0" }}>{status}</p>
          <h4 style={{ fontSize: 12, margin: "8px 0 6px 0", color: "#8B98AC" }}>Gespeicherte Entwürfe</h4>
          {draftList.length === 0 ? (
            <p style={{ fontSize: 12, color: "#4C5A70" }}>Noch keine Entwürfe gespeichert.</p>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {draftList.map((d) => (
                <div key={d.id} style={{ display: "flex", alignItems: "center", gap: 8, background: "#0D1420", border: "1px solid #2A3446", borderRadius: 6, padding: "6px 10px" }}>
                  <div style={{ flex: 1, fontSize: 12 }}>
                    <span style={{ color: "#DCE7FF", fontWeight: 600 }}>{d.titel}</span>{" "}
                    <span style={{ color: "#4C5A70" }}>· {d.ersteller} · {new Date(d.timestamp).toLocaleString("de-DE")}</span>
                  </div>
                  <button onClick={() => openDraft(d)} disabled={busy} style={{ ...styles.btnPrimary, padding: "4px 10px", fontSize: 11 }}>Öffnen</button>
                  <button onClick={() => removeDraft(d.id)} disabled={busy} style={{ padding: "4px 10px", borderRadius: 5, border: "1px solid #3A2A2A", background: "#241717", color: "#E39C9C", fontSize: 11, cursor: "pointer" }}>Löschen</button>
                </div>
              ))}
            </div>
          )}
        </div>

        <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
          {Object.keys(PLANS).map((key) => (
            <button key={key} onClick={() => setPlanKey(key)}
              style={{ padding: "8px 16px", borderRadius: 8, border: "1px solid " + (planKey === key ? "#5B8DEF" : "#2A3446"),
                background: planKey === key ? "#1C2B47" : "#161F2E", color: planKey === key ? "#DCE7FF" : "#8B98AC", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
              {PLANS[key].label}
              <span style={{ display: "block", fontWeight: 400, fontSize: 11, opacity: 0.75 }}>{PLANS[key].people} Pers. · {PLANS[key].weeks} Wochen</span>
            </button>
          ))}
          <div style={{ flex: 1 }} />
          <button onClick={clearPlan} style={{ ...styles.btn, borderColor: "#3A2A2A", background: "#241717", color: "#E39C9C" }}>Diesen Plan leeren</button>
        </div>

        <div style={{ overflowX: "auto", ...styles.panel }}>
          <table style={{ borderCollapse: "collapse", width: "100%", fontSize: 12 }}>
            <thead>
              <tr>
                <th style={{ padding: "4px 8px", textAlign: "left", color: "#8B98AC" }}>Woche</th>
                {WEEKDAY_NAMES.map((n) => <th key={n} style={{ padding: "4px 8px", color: "#8B98AC", minWidth: 64 }}>{n}</th>)}
                <th style={{ padding: "4px 8px", color: "#8B98AC" }}>Parität</th>
                <th style={{ padding: "4px 8px", color: "#8B98AC" }}>AZ</th>
              </tr>
            </thead>
            <tbody>
              {grid.map((row, r) => {
                const parity = parityOf(r);
                const hours = weekHours(row);
                return (
                <tr key={r}>
                  <td style={{ padding: "3px 8px", color: "#8B98AC", fontWeight: 600 }}>{r + 1}</td>
                  {row.map((cell, d) => {
                    const bad = analysis.badCells.has(`${r},${d}`);
                    const options = codesForDayAndParity(planKey, d, parity, cell, grids, r);
                    return (
                      <td key={d} style={{ padding: 2 }}>
                        <select value={cell} onChange={(e) => setCell(r, d, e.target.value)}
                          style={{ width: "100%", padding: "4px 2px", borderRadius: 5, border: "1px solid " + (bad ? "#C24949" : "#2A3446"),
                            background: bad ? "#2A1616" : cell === "." ? "#0D1420" : "#1C2B47", color: bad ? "#F0A8A8" : cell === "." ? "#4C5A70" : "#DCE7FF",
                            fontSize: 11, fontFamily: "monospace", textAlign: "center" }}>
                          {options.map((c) => <option key={c} value={c}>{c}</option>)}
                        </select>
                      </td>
                    );
                  })}
                  <td style={{ padding: "3px 8px", color: "#4C5A70", fontSize: 11 }}>{parity}</td>
                  <td style={{ padding: "3px 8px", color: "#8B98AC", fontSize: 11, textAlign: "right" }}>{hours}h</td>
                </tr>
                );
              })}
            </tbody>
          </table>
          {(() => {
            const avg = avgWeeklyHours(grid);
            const imSoll = Math.abs(avg - SOLL_WOCHENARBEITSZEIT) <= SOLL_TOLERANZ;
            return (
              <div style={{ marginTop: 10, padding: "8px 12px", borderRadius: 8, fontSize: 12,
                background: imSoll ? "#16321F" : "#2A1F16", border: "1px solid " + (imSoll ? "#3E7A4F" : "#7A5A3E"),
                color: imSoll ? "#8FE3A6" : "#E3C08F" }}>
                Ø Wochenarbeitszeit {plan.label}: <strong>{avg.toFixed(1)}h</strong> (Soll: {SOLL_WOCHENARBEITSZEIT}h laut Betriebsvereinbarung)
                {imSoll ? " – im Soll" : ` – Abweichung ${(avg - SOLL_WOCHENARBEITSZEIT).toFixed(1)}h`}
              </div>
            );
          })()}
        </div>

        <div style={styles.panel}>
          <h3 style={{ fontSize: 13, margin: "0 0 4px 0", color: "#8B98AC" }}>Offene Dienste - über alle Rahmenpläne kombiniert</h3>
          <p style={{ fontSize: 11, color: "#4C5A70", margin: "0 0 10px 0" }}>
            Ein Dienst zählt als besetzt, egal in welchem Rahmenplan er eingetragen wurde.
          </p>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            {["ungerade", "gerade"].map((parity) => (
              <div key={parity}>
                <h4 style={{ fontSize: 12, margin: "0 0 8px 0", color: "#8B98AC" }}>{parity === "ungerade" ? "Ungerade" : "Gerade"} Kalenderwoche</h4>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                  {combinedCoverage[parity].map(({ day, required, counts }) => (
                    <div key={day} style={{ minWidth: 100, fontSize: 11 }}>
                      <div style={{ color: "#8B98AC", fontWeight: 600, marginBottom: 2 }}>{WEEKDAY_NAMES[day]}</div>
                      {Object.keys(required).length === 0 && <div style={{ color: "#4C5A70" }}>–</div>}
                      {Object.entries(required).map(([code, need]) => {
                        const have = counts[code]; const ok = have === need;
                        return <div key={code} style={{ color: ok ? "#8FE3A6" : "#F0A8A8", fontFamily: "monospace" }}>{code}: {have}/{need}</div>;
                      })}
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>

        <div style={styles.panel}>
          <h3 style={{ fontSize: 13, margin: "0 0 8px 0", color: "#8B98AC" }}>
            Regelprüfung {plan.label} {analysis.issues.length === 0 ? "- alles in Ordnung" : `- ${analysis.issues.length} Punkt(e)`}
          </h3>
          {analysis.issues.length === 0 ? (
            <p style={{ color: "#8FE3A6", fontSize: 12, margin: 0 }}>Keine Regelverstöße gefunden.</p>
          ) : (
            <ul style={{ margin: 0, paddingLeft: 18, fontSize: 12, color: "#F0A8A8", maxHeight: 220, overflowY: "auto" }}>
              {analysis.issues.map((iss, i) => (
                <li key={i} style={{ marginBottom: 4 }}><span style={{ color: "#8B98AC", fontFamily: "monospace" }}>[{iss.type}]</span> {iss.text}</li>
              ))}
            </ul>
          )}
        </div>

        <div style={styles.panel}>
          <h3 style={{ fontSize: 13, margin: "0 0 8px 0", color: "#8B98AC" }}>Kürzel-Legende</h3>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 6, fontSize: 11 }}>
            {Object.entries(CODES).map(([code, info]) => (
              <div key={code} style={{ color: "#8B98AC" }}>
                <span style={{ fontFamily: "monospace", color: "#DCE7FF" }}>{code}</span> – {info.label}
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<RahmenplanWerkstatt />);
</script>
</body>
</html>
